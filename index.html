<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nini's Paint Pour Creations | Art Showcase</title>
    <style>
        :root {
            --bg-color: #fcfbf9;
            --text-main: #2c2c2c;
            --text-muted: #6b6b6b;
            --card-bg: #ffffff;
            --border-color: #e6e4df;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }
        header {
            text-align: center;
            padding: 4rem 2rem 2rem 2rem;
            border-bottom: 1px solid var(--border-color);
            max-width: 1200px;
            margin: 0 auto;
        }
        header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }
        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2.5rem;
        }
        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }
        .image-wrapper {
            position: relative;
            width: 100%;
            height: 380px;
            background-color: #f4f3ef;
            overflow: hidden;
        }
        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .sku-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 4px 10px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-main);
            border-radius: 2px;
            border: 1px solid var(--border-color);
        }
        .product-info {
            padding: 1.5rem;
            text-align: left;
        }
        .product-info h3 {
            font-size: 1.2rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
        }
        .product-info p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.2rem;
        }
        .modal-btn {
            display: inline-block;
            width: 100%;
            text-align: center;
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--text-main);
            padding: 0.7rem 1rem;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 2px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .modal-btn:hover {
            background-color: var(--text-main);
            color: #ffffff;
        }
        footer {
            text-align: center;
            padding: 3rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Nini's Paint Pour Creations</h1>
        <p>Curated Country-Luxe Art Showcase</p>
    </header>
    <div class="container">
        <div class="gallery-grid">
            <div class="product-card">
                <div class="image-wrapper">
                    <span class="sku-badge">#NPC-001</span>
                    <img src="placeholder-01.jpg" alt="Sage Green Hexagonal Vase">
                </div>
                <div class="product-info">
                    <h3>Sage Green Hexagonal Vase</h3>
                    <p>Hand-poured acrylic finish featuring organic earth tones.</p>
                    <button class="modal-btn" onclick="alert('360-Degree Video View Coming Soon')">View 360° Experience</button>
                </div>
            </div>
        </div>
    </div>
    <footer>
        &copy; 2026 Nini's Paint Pour Creations. All Rights Reserved. Showcase Gallery.
    </footer>
</body>
</html>
