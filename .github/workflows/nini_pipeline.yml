name: Nini Paint Pour Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: pip install google-api-python-client google-auth requests
        
      - name: Run Pipeline Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python *scripts*/*vases*
        
      - name: Commit and Push New Images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.jpg *.png *.jpeg
          git commit -m "Auto-download new showcase vases from Google Drive" || echo "No changes to commit"
          git push
          
