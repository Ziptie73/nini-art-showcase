name: Nini Paint Pour Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours automatically
  workflow_dispatch:        # Allows you to run it manually anytime

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install google-api-python-client google-auth requests

      - name: Run Pipeline Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python *scripts*/*vases*
      
        
